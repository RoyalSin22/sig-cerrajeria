server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (React Router resuelve la navegacion del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API del backend: el navegador solo ve un origen (el propio
    # frontend), asi que no hace falta CORS en produccion.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El refresh token viaja en cookie: hay que reenviarla en ambas direcciones.
        proxy_pass_request_headers on;
    }

    # Imagenes de productos, servidas por el backend como recurso estatico.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    # Swagger, por si se necesita inspeccionar la API desde este mismo origen.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
